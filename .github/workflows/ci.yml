name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The browser regressions need an ffmpeg install; a slow apt mirror once ate
    # the whole 20-minute budget on its own, so the job keeps room for it.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: package.json must not have a UTF-8 BOM
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('package.json');if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF){console.error('package.json has a UTF-8 BOM');process.exit(1)}"
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck application and tests
        run: npm run typecheck && npm run typecheck:test
      - name: Resume unit tests
        run: npm test
      - name: Syntax check browser tests
        run: |
          node --check scripts/browser-resume-test.mjs
          node --check scripts/browser-resume-mock.mjs
          node --check scripts/browser-admin-mock.mjs
          node --check scripts/mock-server.mjs
      - name: Build
        run: npm run build
      - name: Install isolated HLS fixture generator
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          # A runner image can hold the dpkg lock for unattended upgrades; waiting
          # for it beats failing, and --no-install-recommends keeps the download
          # small enough for the job budget.
          sudo apt-get update -o DPkg::Lock::Timeout=300
          sudo apt-get install -y --no-install-recommends -o DPkg::Lock::Timeout=300 ffmpeg
          ffmpeg -version | head -1
      - name: Browser watch lifecycle regression
        run: npm run test:watch
      - name: Browser HLS fixture regression
        run: npm run test:hls
      - name: Browser resume smoke
        run: npm run test:browser
      - name: Browser admin plugin smoke
        run: npm run test:admin
